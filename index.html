<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Для Леры ❤️</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(135deg,#ffe5ec,#fff6f8);font-family:Arial,sans-serif;overflow:hidden;color:#5b2635}
#game{height:100vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:24px;margin:18px 0 5px}
#info{font-size:16px;margin-bottom:8px}
#board{position:relative;width:min(94vw,430px);height:min(65vh,520px);min-height:360px;background:#fff;border:3px solid #ff9ab2;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #d77b9340}
.heart{position:absolute;font-size:34px;user-select:none;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
#player{position:absolute;font-size:42px;left:50%;bottom:18px;transform:translateX(-50%);user-select:none}
#controls{display:grid;grid-template-columns:70px 70px 70px;grid-template-rows:58px 58px;gap:7px;margin-top:10px}
button{border:0;border-radius:16px;background:#ff8eaa;color:white;font-size:25px;font-weight:bold;box-shadow:0 4px 10px #c95d7540}
button:active{transform:scale(.94);background:#ff6f94}
#up{grid-column:2}.empty{visibility:hidden}
#final{position:fixed;inset:0;background:#fff0f5ee;display:none;align-items:center;justify-content:center;text-align:center;padding:25px;z-index:5}
.card{background:white;border-radius:28px;padding:35px 25px;max-width:390px;box-shadow:0 12px 45px #c85d7740}
.card .big{font-size:55px}.card h2{font-size:30px;margin:10px 0;color:#e83d6a}.card p{font-size:21px;line-height:1.45}
</style>
</head>
<body>
<div id="game">
<h1>Для Леры ❤️</h1>
<div id="info">Собери все сердечки: <b><span id="count">0</span>/5</b></div>
<div id="board">
  <div id="player">🥰</div>
</div>
<div id="controls">
  <button id="up">↑</button>
  <button class="empty"></button>
  <button class="empty"></button>
  <button id="left">←</button>
  <button id="down">↓</button>
  <button id="right">→</button>
</div>
</div>

<div id="final">
  <div class="card">
    <div class="big">❤️</div>
    <h2>Лера...</h2>
    <p><b>Я тебя люблю.</b><br>Прости меня, пожалуйста. ❤️</p>
  </div>
</div>

<script>
const board=document.getElementById('board'), player=document.getElementById('player');
const countEl=document.getElementById('count'), final=document.getElementById('final');
let x=50,y=82,count=0;
const hearts=[];

function addHeart(){
  const h=document.createElement('div'); h.className='heart'; h.textContent='❤️';
  h.style.left=(8+Math.random()*82)+'%';
  h.style.top=(8+Math.random()*78)+'%';
  board.appendChild(h); hearts.push(h);
}
for(let i=0;i<5;i++) addHeart();

function move(dx,dy){
  x=Math.max(7,Math.min(93,x+dx));
  y=Math.max(7,Math.min(91,y+dy));
  player.style.left=x+'%'; player.style.top=y+'%'; player.style.bottom='auto';
  check();
}
function check(){
  const pr=player.getBoundingClientRect();
  for(let i=hearts.length-1;i>=0;i--){
    const r=hearts[i].getBoundingClientRect();
    const d=Math.hypot((pr.left+pr.width/2)-(r.left+r.width/2),(pr.top+pr.height/2)-(r.top+r.height/2));
    if(d<45){
      hearts[i].remove(); hearts.splice(i,1); count++;
      countEl.textContent=count;
      if(count===5)setTimeout(()=>final.style.display='flex',300);
    }
  }
}
const controls={up:[0,-6],down:[0,6],left:[-7,0],right:[7,0]};
for(const [id,[dx,dy]] of Object.entries(controls)){
  document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();move(dx,dy)});
}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp')move(0,-6);
 if(e.key==='ArrowDown')move(0,6);
 if(e.key==='ArrowLeft')move(-7,0);
 if(e.key==='ArrowRight')move(7,0);
});
</script>
</body>
</html>
